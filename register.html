<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demande de compte — Mairie de San Andreas</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><div class="auth-card wide"><div class="brand auth-brand"><div class="brand-mark">MSA</div><div><b>Mairie</b><span>de San Andreas</span></div></div><h1>Demander un compte</h1><p class="muted">Votre demande sera examinée par l'administration.</p><form id="registerForm"><div class="grid-2"><label>Nom d'utilisateur<input id="username" required minlength="3"></label><label>Nom affiché<input id="displayName" required></label></div><label>Mot de passe<input id="password" type="password" required minlength="8"></label><label>Motif / fonction<textarea id="reason" rows="3"></textarea></label><button class="primary-btn">Envoyer la demande</button><div id="message"></div></form><p class="auth-link"><a href="login.html">Retour à la connexion</a></p></div><script type="module" src="js/register.js"></script></body></html>
